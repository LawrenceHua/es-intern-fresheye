<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshEye - Produce Freshness Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>FreshEye</h1>
        <p class="subtitle">AI-Powered Produce Freshness Scanner</p>

        <div class="upload-area" id="dropZone">
            <p>Drag & drop a photo of produce here</p>
            <p>or</p>
            <input type="file" id="fileInput" accept="image/*">
            <button onclick="document.getElementById('fileInput').click()">Choose File</button>
        </div>

        <div id="preview" class="preview" style="display: none;">
            <img id="previewImage" src="" alt="Preview">
        </div>

        <button id="classifyBtn" onclick="classifyImage()" style="display: none;">
            Scan for Freshness
        </button>

        <div id="result" class="result" style="display: none;">
            <h2>Results</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
